b_tiberium_mine_2:0 "Advanced Tiberium Harvester"
b_tiberium_mine_2_desc:0 "An upgraded version of the Tiberium Harvester, featuring more advanced extraction techniques and increased output."

b_tiberium_refinery:0 "Tiberium Refinery"
